repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        always_run: true
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        always_run: true
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --all-features
        language: system
        always_run: true
        pass_filenames: false
      - id: cargo-build-release
        name: cargo build release
        entry: cargo build --release --all-features
        language: system
        always_run: true
        pass_filenames: false
