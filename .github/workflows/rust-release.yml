name: Rust Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: agent-view-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: agent-view-linux-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: agent-view-linux-x64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: agent-view-linux-arm64-musl
          - target: x86_64-apple-darwin
            # Cross-compile from Apple Silicon. `macos-13` (the last Intel
            # runner) has chronic ~50min queue waits on the free public
            # tier; `macos-latest` with `rustup target add x86_64-apple-darwin`
            # (the step below) produces an x86_64 binary in ~2min.
            os: macos-latest
            artifact: agent-view-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: agent-view-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Belt-and-suspenders: dtolnay/rust-toolchain@stable's `targets:` input
      # has been observed to silently skip installing non-host targets on
      # recent runner images (failed v1.11.0 + v1.11.1 release builds with
      # `error[E0463]: can't find crate for 'core'`). Explicit install
      # guarantees the target is present on every runner.
      - name: Ensure target installed
        run: rustup target add ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz agent-view
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.tar.gz
          generate_release_notes: true
